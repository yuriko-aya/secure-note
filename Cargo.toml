[package]
name = "secure-note"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = { version = "0.23.1", features = ["std"] }
rand = { version = "0.10.4", features = ["std"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
